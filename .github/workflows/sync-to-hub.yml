name: Sync to Hugging Face Hub
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN_MNIST: ${{ secrets.HF_TOKEN_MNIST }}
        run: git push https://devtanu:$HF_TOKEN_MNIST@huggingface.co/spaces/devtanu/mnist-digit-classifier main